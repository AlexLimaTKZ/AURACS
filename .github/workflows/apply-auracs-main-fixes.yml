name: Apply AURACS main fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-auracs-main-fixes.yml

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "0f578ff0ab0c926ff565688b8aee81e647800bb1" HEAD
          test "$(git diff --name-only 0f578ff0ab0c926ff565688b8aee81e647800bb1..HEAD)" = ".github/workflows/apply-auracs-main-fixes.yml"

      - name: Reconstruct and verify immutable applicator
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_SHA="a141ed72a3ad1f2ed589918c06c22049bdb59bbb"
          git fetch origin automation/auracs-main-fixes
          : > /tmp/payload.b64
          for i in 00 01 02 03 04 05 06 07; do
            git show "${PAYLOAD_SHA}:.auracs-patch/chunk${i}.txt" >> /tmp/payload.b64
          done
          base64 -d /tmp/payload.b64 > /tmp/apply.py.gz
          gzip -t /tmp/apply.py.gz
          gzip -dc /tmp/apply.py.gz > /tmp/apply.py
          echo "24d3304d9f11acc580196645c0176804492d244f2278bb66910a0144db08d6a2  /tmp/apply.py" | sha256sum -c -
          python -m py_compile /tmp/apply.py

      - name: Apply corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply.py .
          rm .github/workflows/apply-auracs-main-fixes.yml
          git status --short
          test -n "$(git status --short)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Backend restore
        run: dotnet restore AURACS.sln

      - name: Backend build
        run: dotnet build AURACS.sln --configuration Release --no-restore

      - name: Backend tests
        run: dotnet test api.Tests/api.Tests.csproj --configuration Release --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend tests
        working-directory: web
        run: npm test

      - name: Frontend lint
        working-directory: web
        run: npm run lint

      - name: Frontend build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build

      - name: Commit and push validated corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            api/Program.cs \
            api/SafeCodeEvaluator.cs \
            api/ChallengeValidator.cs \
            api.Tests/SafeCodeEvaluatorTests.cs \
            web/package.json \
            web/src/lib/api.ts \
            web/src/lib/store.ts \
            web/src/lib/gameRules.ts \
            web/src/lib/gameProgress.ts \
            web/src/game/worldGeometry.ts \
            web/src/hooks/useGameEngine.ts \
            web/src/components/ScreenShake.tsx \
            web/src/components/GameWorld.tsx \
            web/tests/gameRules.test.ts \
            web/tests/progress.test.ts \
            web/tests/worldGeometry.test.ts \
            web/src/components/MainMenu.tsx \
            web/src/app/page.tsx \
            web/src/game/createShipGame.ts \
            web/src/lib/chapters.ts \
            package.json \
            README.md \
            web/src/lib/evaluator.ts \
            web/src/app/api/run/route.ts \
            web/src/app/api/reset/route.ts \
            .github/workflows/apply-auracs-main-fixes.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: harden evaluator and chapter 2 progression"
          git push origin HEAD:main
