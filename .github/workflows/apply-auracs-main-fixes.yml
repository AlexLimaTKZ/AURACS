name: Apply AURACS main fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-auracs-main-fixes.yml]

permissions:
  contents: write

concurrency:
  group: auracs-main-migration
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed base
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="0f578ff0ab0c926ff565688b8aee81e647800bb1"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = ".github/workflows/apply-auracs-main-fixes.yml"

      - name: Reconstruct verified applicator
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/reconstruct.log) 2>&1

          PAYLOAD_SHA="80e57e820ed71f5362f95f04ad3b595b392442f9"
          git fetch origin automation/auracs-payload-v2
          git cat-file -e "${PAYLOAD_SHA}^{commit}"

          EXPECTED=(
            7afe7928f973ef830ff32ffa0aa5b3bffe1ea052
            3ae1bb3a0a52c31884522b88ee77ceab867f11d8
            9b933f6391ab557be26ed97723a6196cea666933
            01339f50902a8aaf9d7d6316d97096ae1eec26c1
            f1097c947a8de01679eb683ff9ded9cb117fd20e
            8fa5cb3cd955e6336256a42b7dfdae125b87be2e
            ac6250fa7a991865eecd66a7502450fbc977c675
            56fb747637f25c548894317fbc49c06594065f90
          )

          : > /tmp/payload.b64
          for i in 0 1 2 3 4 5 6 7; do
            idx=$(printf '%02d' "$i")
            path=".auracs-patch/chunk${idx}.txt"
            actual=$(git rev-parse "${PAYLOAD_SHA}:${path}")
            expected="${EXPECTED[$i]}"
            echo "${path}: ${actual}"
            test "$actual" = "$expected"
            git show "${PAYLOAD_SHA}:${path}" >> /tmp/payload.b64
          done

          test "$(wc -c < /tmp/payload.b64)" -eq 47556
          echo "ae98ab7c20894aab3451ed707f93908910c2aef57400a1b2128879c470f88b8d  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 > /tmp/apply.py.gz
          gzip -t /tmp/apply.py.gz
          gzip -dc /tmp/apply.py.gz > /tmp/apply.py
          echo "6fff09e1e2068015732e93213d32bf8ea84e97edecc6618adacc82d0d682652d  /tmp/apply.py" | sha256sum -c -
          python -m py_compile /tmp/apply.py

      - name: Apply corrections
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply.py .
          rm .github/workflows/apply-auracs-main-fixes.yml
          git status --short | tee /tmp/apply-status.log
          test -n "$(git status --short)"

      - name: Setup .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Backend restore
        id: backend_restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore AURACS.sln 2>&1 | tee /tmp/backend-restore.log

      - name: Backend build
        id: backend_build
        shell: bash
        run: |
          set -o pipefail
          dotnet build AURACS.sln --configuration Release --no-restore 2>&1 | tee /tmp/backend-build.log

      - name: Backend tests
        id: backend_tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test api.Tests/api.Tests.csproj --configuration Release --no-build 2>&1 | tee /tmp/backend-tests.log

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend install
        id: frontend_install
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/frontend-install.log

      - name: Frontend audit
        id: frontend_audit
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/frontend-audit.log

      - name: Frontend tests
        id: frontend_tests
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/frontend-tests.log

      - name: Frontend lint
        id: frontend_lint
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/frontend-lint.log

      - name: Frontend build
        id: frontend_build
        working-directory: web
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log

      - name: Commit and push validated corrections
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat | tee /tmp/publish.log
          git commit -m "fix: harden evaluator and chapter 2 progression"
          git push origin HEAD:main

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/last-run-status.txt
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "reconstruct=${{ steps.reconstruct.outcome }}"
            echo "apply=${{ steps.apply.outcome }}"
            echo "setup_dotnet=${{ steps.setup_dotnet.outcome }}"
            echo "backend_restore=${{ steps.backend_restore.outcome }}"
            echo "backend_build=${{ steps.backend_build.outcome }}"
            echo "backend_tests=${{ steps.backend_tests.outcome }}"
            echo "setup_node=${{ steps.setup_node.outcome }}"
            echo "frontend_install=${{ steps.frontend_install.outcome }}"
            echo "frontend_audit=${{ steps.frontend_audit.outcome }}"
            echo "frontend_tests=${{ steps.frontend_tests.outcome }}"
            echo "frontend_lint=${{ steps.frontend_lint.outcome }}"
            echo "frontend_build=${{ steps.frontend_build.outcome }}"
            echo "publish=${{ steps.publish.outcome }}"
            for log in /tmp/reconstruct.log /tmp/apply-status.log /tmp/backend-restore.log /tmp/backend-build.log /tmp/backend-tests.log /tmp/frontend-install.log /tmp/frontend-audit.log /tmp/frontend-tests.log /tmp/frontend-lint.log /tmp/frontend-build.log /tmp/publish.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $(basename "$log") ====="
                tail -n 160 "$log"
              fi
            done
          } > "$STATUS"
          git fetch origin automation/auracs-main-fixes
          git worktree add -B automation/auracs-main-fixes /tmp/auracs-staging origin/automation/auracs-main-fixes
          cp "$STATUS" /tmp/auracs-staging/.auracs-patch/last-run-status.txt
          cd /tmp/auracs-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .auracs-patch/last-run-status.txt
          git commit -m "chore: record AURACS migration failure ${GITHUB_RUN_ID}" || true
          git push origin HEAD:automation/auracs-main-fixes
